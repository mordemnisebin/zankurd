# Bu dosya DEPO KÖKÜNDE durmalıdır.
#
# 2026-07-31 denetimine kadar `zankurd_mobile/.github/workflows/` altındaydı.
# GitHub Actions yalnızca deponun kökündeki `.github/workflows` dizinini okur,
# dolayısıyla biçim denetimi, `dart analyze`, soru kalitesi kapısı, testler
# ve APK derlemesi hiçbir push'ta koşmuyordu — README ise yayın adımı olarak
# "CI sonucunu doğrulayın" diyordu. Doğrulanacak bir CI yoktu.
#
# Uygulama bir alt dizinde olduğu için her adım `defaults.run.working-directory`
# ile oraya iner. Dikkat: `upload-artifact` yolları bu ayardan ETKİLENMEZ,
# onlar her zaman depo köküne göredir; bu yüzden aşağıda tam yol yazılıdır.
name: ZanKurd Flutter CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: zankurd_mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.7'
        channel: 'stable'

    - name: Install app dependencies
      run: flutter pub get

    - name: Check formatting
      # offline_question_bank.dart üretilmiş bir dosya; kanonik biçimini
      # tool/verify_and_fix_question_bank.py belirliyor, dart format'ınkiyle
      # çelişiyor (bkz. 2026-07-23: dart format bu dosyayı ~18k satır
      # değiştirip offline_questions_json_equivalence_test.dart'ı kırdı).
      # `dart format` CLI'ında analysis_options.yaml tabanlı hariç tutma
      # desteklenmediğinden burada elle dışlanıyor.
      run: |
        dart format --set-exit-if-changed \
          $(find . -name '*.dart' \
            -not -path './build/*' \
            -not -path '*/.dart_tool/*' \
            -not -path './lib/src/data/offline_question_bank.dart')

    - name: Run app static analysis
      run: dart analyze

    - name: Check question quality regressions
      run: dart run tool/question_quality/question_quality_audit.dart gate

    # Şık sızması taraması (saf Python, mandalı `FINDING_RATCHET = 0`).
    #
    # Niçin CI'da: bu araç 2026-08-22'ye kadar bulgu üretiyor ama hüküm
    # vermiyordu; mandal o gün eklendi, ama mandalı çeken bir koşucu
    # yoktu. Bulgusunu kimseye söylemeyen bir bekçi, tıpkı deponun
    # kökünde durmayan bir CI dosyası gibi (bkz. bu dosyanın başlığı),
    # yalnız varmış gibi görünür.
    #
    # Dart kalite kapısından ayrı durur: kapı elle sayılmış bir kaynak
    # listesine bakar, bu tarama banka listesini
    # `question_bank_assets.dart` manifestosundan okur — yeni eklenen bir
    # bankayı kendiliğinden kapsar.
    - name: Check option-leak scan (Python)
      run: python3 tool/content_authoring/sik_kalite_taramasi.py

    - name: Run unit and widget tests with coverage
      run: flutter test --coverage

    # Ekran turu her ana ekranı gerçek widget ağacıyla açıp PNG'ye basar.
    #
    # Niçin CI'da: tur elle çalıştırılan bir araçtı ve kimse çalıştırmayınca
    # hiçbir şey söylemiyordu. Oysa 2026-08-16'da Kurmancî joker
    # etiketlerinin kırpıldığını bulan oydu — kusur widget testlerine
    # görünmüyordu çünkü onlar metnin VARLIĞINI ölçüyor, genişliğini değil.
    #
    # Bu adım bir piksel karşılaştırması DEĞİLDİR: Linux koşucusu ile
    # macOS aynı kareyi birebir çizmez, öyle bir kapı sürekli yanlış alarm
    # verirdi. Ölçtüğü şey daha temel ve yine de değerli: her ekran
    # istisnasız açılıyor ve çiziliyor mu. Kareler artefakt olarak
    # yükleniyor; düzen bozulduğunda insan bakacak bir şey buluyor.
    - name: Render screen tour
      run: flutter test tool/screenshots/screen_tour_test.dart

    - name: Upload screen tour
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screen-tour
        path: zankurd_mobile/docs/screenshots/tour/
        retention-days: 14

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: zankurd_mobile/coverage/lcov.info
        retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.7'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build Android APK (debug)
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: zankurd_mobile/build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 14

  # İmzalı IPA insan adımı olarak kalır. Bu iş yalnız derlemenin
  # kırılmadığını söyler; mağaza yüklemesi yapmaz.
  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.7'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build iOS (debug, no codesign)
      run: flutter build ios --debug --no-codesign
