project_id = "zankurd_mobile"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enable_anonymous_sign_ins = true

# send-push JWT değil paylaşılan sırla (`x-cron-secret` = CRON_SECRET) korunur:
# çağıran pg_cron/pg_net, kullanıcı oturumu taşımaz. Bu satır olmadan
# `supabase functions deploy send-push` platform kapısında 401 verir.
[functions.send-push]
verify_jwt = false

# avatar-sweep de aynı paylaşılan sırla korunur (saatlik pg_cron çağırır).
[functions.avatar-sweep]
verify_jwt = false

# apple-revoke iki yoldan çağrılır: kullanıcı oturumuyla (register/revoke) ve
# pg_cron ile `x-cron-secret` başlığıyla (yetim jeton süpürmesi). Platform
# kapısı JWT'siz cron'u keserdi; kullanıcı yolunda işlev `auth.getUser` ile
# JWT'yi kendisi doğrular (yoksa 401), yani kapıyı kapatmak güvenliği azaltmaz.
[functions.apple-revoke]
verify_jwt = false
