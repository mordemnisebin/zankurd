name: zankurd_mobile
description: "ZanKurd is a Kurmanci quiz app with online rooms and leaderboard support."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.1+22

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # `cupertino_icons` bilerek YOK: uygulama hiçbir Cupertino widget'ı/ikonu
  # kullanmıyor ve release derlemede kullanılmayan yazı tipi budanmıyor,
  # 258 KB olduğu gibi pakete giriyordu (bkz. test/asset_usage_test.dart).
  supabase_flutter: ^2.14.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1

  # Crash reporting
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  firebase_messaging: ^16.0.0

  # State management
  provider: ^6.1.0
  shared_preferences: ^2.5.5

  # Ses efektleri
  audioplayers: ^6.1.0

  # Metin-okuma (TTS) — soruları seslendirme
  flutter_tts: ^4.2.3

  # Shimmer skeleton loading
  shimmer: ^4.0.0


  share_plus: ^13.2.1

  in_app_review: ^2.0.9

  # Dış bağlantılar (gizlilik politikası / kullanım koşulları)
  url_launcher: ^6.3.2

  # Abonelik / premium yönetimi (RevenueCat)
  purchases_flutter: ^10.6.0

  connectivity_plus: ^7.3.0
  # Uzak ulaşılabiliğer yoklaması (`_pingSupabase`): boot'da zaman aşımına
  # uğrayan Supabase başlatmasının sonradan gerçekten açıldığına, yani
  # sunucuya ağ turu atılabildiğine bakar. dev'te DEĞİL: lib/ kullanıyor.
  http: ^1.2.0
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
  flutter_timezone: ^5.1.0

  # Ağ görseli önbellekleme
  cached_network_image: ^3.4.1

  # Lucide ikon yazı tipi paket olarak DEĞİL, `assets/fonts/Lucide.ttf` olarak
  # taşınır: `lucide_icons_flutter` paketi 6 ağırlıklı değişken yazı tipini
  # de (2,86 MB) bildiriyor ve kullanılmayan yazı tipi budanmadan pakete
  # giriyordu. AppIcons yalnız statik `Lucide` ailesini kullanır.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Testing
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # Zamanlayıcı/geri çekilmeli yeniden deneme testleri (sahte saat).
  fake_async: ^1.3.3
  # `UrlLauncherPlatform.instance`i sahte bir uygulamayla değiştirip
  # "hedefi açacak uygulama yok" durumunu simüle etmek için
  # (test/legal_link_open_failure_test.dart).
  url_launcher_platform_interface: ^2.3.2
  patrol: ^4.10.0

patrol:
  app_name: ZanKurd
  test_directory: patrol_test
  android:
    package_name: com.zankurd.app
  ios:
    bundle_id: com.zankurd.app


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/question_images/
    - assets/zankurd.webp
    - assets/zankurd_icon.webp
    - assets/sounds/
    # İkon yazı tipi lisansları lisans sayfasına koddan kaydedilir
    # (lib/src/utils/bundled_font_licenses.dart).
    - assets/fonts/LICENSE-FontAwesome.txt
    - assets/fonts/LICENSE-Lucide.txt
    # Veri bankaları TEK TEK sayılır; `assets/data/` klasörü bildirilmez.
    # Klasör bildirilince karantinadaki `deepseek_2026_08_18_questions.json`
    # (1,5 MB, çalışma zamanında hiç okunmaz) da pakete giriyordu. Yeni banka
    # eklerken `lib/src/data/question_bank_assets.dart` + buraya; unutulursa
    # `test/asset_usage_test.dart` kırılır.
    - assets/data/image_credits.json
    - assets/data/sentence_building_questions.json
    - assets/data/fill_in_blank_2026_08_questions.json
    - assets/data/community_questions.json
    - assets/data/editorial_questions.json
    - assets/data/offline_questions.json
    - assets/data/expansion_2026_08_questions.json
    - assets/data/source_first_2026_08_questions.json
    - assets/data/visual_2026_08_07_questions.json
    - assets/data/restore_2026_08_07_questions.json
    - assets/data/expansion_2026_08_19_questions.json
    - assets/data/expansion_2026_09_28_questions.json
    - assets/data/deepseek_verified_2026_09_30_questions.json
    - assets/data/bilim_2026_09_30_questions.json
    - assets/data/altkonu_2026_10_01_questions.json
    - assets/data/ders_2026_10_01_questions.json
    - assets/data/bosluk_2026_10_02_questions.json
    - assets/data/ders_2026_10_02_questions.json
    - assets/data/baslangic_2026_10_06_questions.json

  # Şahnê yazı tipleri (OFL; lisans metinleri assets/fonts/OFL-*.txt).
  # Değişken dosyalardan sabit kalınlıklar üretildi: FontWeight doğrudan
  # çalışsın, her TextStyle'a FontVariation yazmak gerekmesin.
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
    # Yalnız Google ve Apple marka glifleri (`BrandIcons`). font_awesome_flutter
    # paketi Solid + Regular + Brands = ~718 KB yazi tipi tasiyordu, uygulama
    # yalniz Brands'ten iki glif kullaniyordu; Brands dosyasi degistirilmeden
    # buraya alindi, paket kaldirildi. Lisans: assets/fonts/LICENSE-FontAwesome.txt
    - family: FontAwesomeBrands
      fonts:
        - asset: assets/fonts/Font-Awesome-7-Brands-Regular-400.otf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
