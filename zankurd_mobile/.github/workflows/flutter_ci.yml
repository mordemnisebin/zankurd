name: ZanKurd Flutter CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.1'
        channel: 'stable'

    - name: Install app dependencies
      run: flutter pub get

    - name: Check formatting
      # offline_question_bank.dart üretilmiş bir dosya; kanonik biçimini
      # tool/verify_and_fix_question_bank.py belirliyor, dart format'ınkiyle
      # çelişiyor (bkz. 2026-07-23: dart format bu dosyayı ~18k satır
      # değiştirip offline_questions_json_equivalence_test.dart'ı kırdı).
      # `dart format` CLI'ında analysis_options.yaml tabanlı hariç tutma
      # desteklenmediğinden burada elle dışlanıyor.
      run: |
        dart format --set-exit-if-changed \
          $(find . -name '*.dart' \
            -not -path './build/*' \
            -not -path '*/.dart_tool/*' \
            -not -path './lib/src/data/offline_question_bank.dart')

    - name: Run app static analysis
      run: dart analyze

    - name: Check question quality regressions
      run: dart run tool/question_quality/question_quality_audit.dart gate

    - name: Run unit and widget tests with coverage
      run: flutter test --coverage

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/lcov.info
        retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.1'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build Android APK (debug)
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 14
