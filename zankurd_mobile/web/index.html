<!DOCTYPE html>
<html lang="ku">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZanKurd — Fêrbûna Kurmancî bi lîstik, pêşbirk û xelatan.">
  <!-- Tarayıcı çubuğu ve PWA rengi. #F5931E emekli marka turuncusuydu;
       palet 2026-07-24'te Tîrêj'e (#C2560E) geçti ama web tarafı geride
       kaldı ve uygulama ile site iki ayrı turuncu gösteriyordu
       (2026-07-27). -->
  <meta name="theme-color" content="#C2560E">

  <!-- Open Graph -->
  <meta property="og:title" content="ZanKurd">
  <meta property="og:description" content="Fêrbûna Kurmancî bi lîstik, pêşbirk û xelatan.">
  <!-- Dosya adı `icon-192x192.png` idi; böyle bir dosya hiç yok (gerçek
       adlar Icon-192/Icon-512). Bağlantı paylaşılınca önizleme görseli
       kırık geliyordu. 512, Open Graph'ın önerdiği en küçük ölçünün
       üstünde (2026-07-27). -->
  <meta property="og:image" content="https://zankurd.com/icons/Icon-512.png">
  <meta property="og:url" content="https://zankurd.com">
  <meta property="og:type" content="website">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ZanKurd">
  <meta name="twitter:description" content="Fêrbûna Kurmancî bi lîstik, pêşbirk û xelatan.">
  <!-- `summary_large_image` kartı görsel ister; hiç `twitter:image` yoktu,
       yani kart boş bir çerçeve olarak çıkıyordu. -->
  <meta name="twitter:image" content="https://zankurd.com/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ZanKurd">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZanKurd</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Erişilebilirlik: klavye/ekran okuyucu focus göstergesi belirgin olsun.
       Varsayılan 1px ince halka yerine 2px marka turuncusu halka.
       Renk 2026-07-27'de Tîrêj'e çekildi: eski #F5931E emekli edilmişti
       ve odak halkası tek başına eski paletten kalmıştı. */
    flt-semantics:focus,
    flt-semantics [tabindex]:focus {
      outline: 2px solid #C2560E !important;
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=zankurd_premium_v2" async></script>
</body>
</html>
